name: tests

on:
  pull_request:
  push:
    branches:
    - main

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Maven Central answers some first requests from the GitHub runners with "not found" for an artifact it has;
      # the Google mirror of Central does not.
      - name: Use the Google mirror of Maven Central
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings><mirrors><mirror><id>gcs-central</id><mirrorOf>central</mirrorOf>
          <url>https://maven-central.storage-download.googleapis.com/maven2/</url></mirror></mirrors></settings>
          XML
      - name: Run all the tests, including the OBP-API contract and the v5.1.0 version floor
        run: mvn -B test
